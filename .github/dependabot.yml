# Dependabot: github-actions ecosystem is configured for historical parity;
# action refs use default branches (@main/@master), so they never need bumps.
# Commit messages follow Conventional Commits (chore(deps)).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
