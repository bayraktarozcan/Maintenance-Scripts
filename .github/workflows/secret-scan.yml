# Automation Scripts - Secret scanning
# Scans every commit in the repository history for leaked secrets with pinned gitleaks.

name: "Secret Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download gitleaks v8.30.1
        run: |
          VERSION=v8.30.1
          FILENAME=gitleaks_8.30.1_linux_x64.tar.gz
          BASE=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSL -o "$FILENAME" "$BASE/$VERSION/$FILENAME"
          curl -sSL -o checksums.txt "$BASE/$VERSION/gitleaks_8.30.1_checksums.txt"
          grep "$FILENAME" checksums.txt | sha256sum --check --strict
          tar -xzf "$FILENAME"

      - name: Scan repository history
        run: ./gitleaks git --redact --exit-code 1
