# Automation Scripts - Secret scanning
# Scans every commit in the repository history for leaked secrets with checksum-verified gitleaks.

name: "Secret Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download latest gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release view --repo gitleaks/gitleaks --json tagName --jq .tagName)
          FILENAME="gitleaks_${VERSION#v}_linux_x64.tar.gz"
          BASE=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSL -o "$FILENAME" "$BASE/$VERSION/$FILENAME"
          curl -sSL -o checksums.txt "$BASE/$VERSION/gitleaks_${VERSION#v}_checksums.txt"
          grep "$FILENAME" checksums.txt | sha256sum --check --strict
          tar -xzf "$FILENAME"

      - name: Scan repository history
        run: ./gitleaks git --redact --exit-code 1
