# Automation Scripts - Hygiene
# Lints workflow files with actionlint. Fails only in Actions tab.
# Note: codespell was evaluated and rejected - it flags correct Turkish words
# and splits non-ASCII words into false fragments.

name: "Hygiene"

on:
  schedule:
    - cron: "45 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Run actionlint
        uses: rhysd/actionlint@main
        with:
          fail-on-error: true
      - name: Audit published release hygiene
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./Tools/Check-ReleaseHygiene.ps1 -Check
