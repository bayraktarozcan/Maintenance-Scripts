# Automation Scripts - Validate
# Dependency-free checks: PowerShell syntax, whitespace errors, log-hygiene.
# Fails only in Actions tab.

name: "Validate"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $errs = $null
          Get-ChildItem -Recurse -Filter *.ps1 . | ForEach-Object {
            $toks = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$toks, [ref]$errs)
          }
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Output $_.Message }; exit 1 }

      - name: Trailing whitespace in added lines
        run: |
          if git show --format= --unified=0 HEAD | grep -nE '^\+.*[[:blank:]]+$'; then
            echo "Trailing whitespace found above."
            exit 1
          fi

      - name: Mojibake scan (tracked files)
        shell: pwsh
        run: ./Scripts/Check-Mojibake.ps1 -Files

      - name: Mojibake scan (pushed commits)
        if: github.event_name == 'push'
        shell: pwsh
        run: './Scripts/Check-Mojibake.ps1 -Commits -CommitRange "${{ github.event.before }}..HEAD"'

      - name: Mojibake scan (pull request commits)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: './Scripts/Check-Mojibake.ps1 -Commits -CommitRange "${{ github.event.pull_request.base.sha }}..HEAD"'
