# Automation Scripts - Quality
# Runs Pester tests for report logic and static checks for batch files.
# Fails only in Actions tab.

name: "Quality"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Set up Python floor and latest
        uses: actions/setup-python@main
        with:
          python-version: |
            3.11
            3.x

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
