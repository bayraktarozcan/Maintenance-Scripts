# Automation Scripts - Quality
# Runs Pester tests for report logic and static checks for batch files.
# Fails only in Actions tab.

name: "Quality"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
