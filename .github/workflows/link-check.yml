# Automation Scripts - Link Check
# Checks Markdown links weekly, on pushes to main, and on PRs touching docs.
# Fails only in Actions tab.

name: "Link Check"

on:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Check links
        # lychee-action's default branch is master, not main.
        uses: lycheeverse/lychee-action@master
        with:
          args: >-
            --no-progress --max-retries 2
            --exclude '^https://www\.iso\.org/standard/(77520|86308|86612)\.html$'
            './**/*.md'
          fail: true
