# Maintenance Scripts - GitLab CI
# Mirror of the GitHub quality gates: validate, quality, hygiene, link check, secret scan.
# Images and tools are pinned for reproducible runs.

stages:
  - validate
  - quality
  - hygiene
  - linkcheck
  - secret
  - textaudit

variables:
  GIT_DEPTH: 0

.ps_base: &ps_base
  image:
    name: mcr.microsoft.com/powershell:7.5-ubuntu-22.04@sha256:a3affe99603400235501b8da8be5f9e40152d4db6557f698a91da0280f9e1469
    entrypoint: [""]

validate:
  <<: *ps_base
  stage: validate
  before_script:
    - apt-get update >/dev/null && apt-get install -y --no-install-recommends git >/dev/null
  script:
    - |
      pwsh -NoProfile -Command '
        $errs = $null
        Get-ChildItem -Recurse -Filter *.ps1 . | ForEach-Object {
          $toks = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$toks, [ref]$errs)
        }
        if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Output $_.Message }; exit 1 }
      '
    - |
      if git show --format= --unified=0 HEAD | grep -nE '^\+.*[[:blank:]]+$'; then
        echo "Trailing whitespace found above."
        exit 1
      fi
    - |
      pwsh -NoProfile -File ./Scripts/Check-Mojibake.ps1 -Files
    - |
      pwsh -NoProfile -File ./Scripts/Check-Mojibake.ps1 -Commits -CommitRange "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

quality:
  <<: *ps_base
  stage: quality
  script:
    - pwsh -NoProfile -Command "Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser"
    - |
      pwsh -NoProfile -Command '
        $cfg = New-PesterConfiguration
        $cfg.Run.Path = "./Tests"
        $cfg.Output.Verbosity = "Detailed"
        Invoke-Pester -Configuration $cfg
      '
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.golang_base: &golang_base
  image:
    name: golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
    entrypoint: [""]

hygiene:
  <<: *golang_base
  stage: hygiene
  script:
    - go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - "$(go env GOPATH)/bin/actionlint -color"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

linkcheck:
  <<: *golang_base
  stage: linkcheck
  script:
    - wget -q -O /tmp/lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
    - echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  /tmp/lychee.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/lychee.tar.gz -C /tmp
    - /tmp/lychee-x86_64-unknown-linux-musl/lychee --no-progress --max-retries 2 './**/*.md'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

secret_scan:
  <<: *golang_base
  stage: secret
  script:
    - apk add --no-cache git
    - go install github.com/zricethezav/gitleaks/v8@v8.30.1
    - $(go env GOPATH)/bin/gitleaks git --redact --exit-code 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Weekly sweep of the platforms' public text fields (mirrors GitHub
# text-audit.yml). Requires a pipeline schedule on GitLab to run.
text_audit:
  <<: *ps_base
  stage: textaudit
  before_script:
    - apt-get update >/dev/null && apt-get install -y --no-install-recommends curl >/dev/null
  script:
    - |
      curl -fsSL "https://api.github.com/repos/bayraktarozcan/Maintenance-Scripts" -o /tmp/gh-meta.json
      curl -fsSL "https://api.github.com/repos/bayraktarozcan/Maintenance-Scripts/releases" -o /tmp/gh-releases.json
      curl -fsSL "https://gitlab.com/api/v4/projects/bayraktarozcan%2FMaintenance-Scripts" -o /tmp/gl-meta.json
      curl -fsSL "https://gitlab.com/api/v4/projects/bayraktarozcan%2FMaintenance-Scripts/releases" -o /tmp/gl-releases.json
    - |
      for f in /tmp/gh-meta.json /tmp/gh-releases.json /tmp/gl-meta.json /tmp/gl-releases.json; do
        pwsh -NoProfile -File ./Scripts/Check-Mojibake.ps1 -JsonFile "$f" || exit 1
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'